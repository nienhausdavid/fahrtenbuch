[project]
name = "fahrtenbuch"
authors = [
    { name = "Dein Name", email = "info@example.com" },
]
description = "Fahrten zum Kunden dokumentieren, Kilometerstand per Foto erkennen und optional automatisch abrechnen"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["Pillow"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
